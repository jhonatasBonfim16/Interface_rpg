<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <nav>
        <div class="nav-div-a">
            <p><a href="./paginas/tiro.html">Tiroteio</a></p>

        <div class="nav-div-a">

        </div>

    <div class="primeiraDiv">
        <div class="conteiner">
            <div class="conteiner-grid">
                <h1>Cadastro de Personagem</h1>      
                <h3>Insira as informações dos personagens</h3>
                <div>

                    <label>Nome</label>
                    <input type="text" id="nomePersonagem">
                </div>

                <div class="conteiner-grid-checkbox">
                    <input type="checkbox" class="shared" data-input="#numberDefesa"> Defesa
                    <input type="number" id="numberDefesa" max="30" disabled>
                </div>
                <div>
                    <input type="checkbox" class="shared" data-input="#numberAgilidade"> Agilidade
                    <input type="number" id="numberAgilidade" max="30" disabled>
                </div>
                <div>
                    <input type="checkbox" class="shared" data-input="#numberGatilho"> Gatilho
                    <input type="number" id="numberGatilho" max="30" disabled>
                </div>
                <div>
                    <input type="checkbox" class="shared" data-input="#numberForca"> Força
                    <input type="number" id="numberForca" max="30" disabled>
                </div>








                <label type="number">Resistência do personagem</label>
                <select id="resistencia">
                    <option value="um">1</option>
                    <option value="dois">2</option>
                    <option value="tres">3</option>
                    <option value="quatro">4</option>
                    <option value="5">5</option>
                </select>
                <div class="conteiner-btn">
                    <button id="btn_dados_personagem">Inserir</button>
                </div>
            </div>

            <div class="conteiner-objetos">
                <div>
                    <h1>Cadastro de objetos</h1>
                    <h3>Insira as informações dos objetos</h3>
                    <label>Nome</label>
                    <input type="text" id="nomeObjeto">
                </div>
                <div class="conetiner-objetos-select">
                    <label>Resistência</label>
                    <select id="resistenciaObjeto">
                        <option value="um" id="um">1</option>
                        <option value="dois" id="dois">2</option>
                        <option value="tres" id="tres">3</option>
                        <option value="quatro" id="quatro">4</option>
                        <option value="cinco" id="cinco">5</option>
                    </select>
                </div>
                <div class="conteiner-btn">
                    <button id="inserirDadosObjetos">Inserir</button>
                </div>
            </div>
        </div>
    </div>
    </div>    
    <!-- Copie e cole exatamente esta linha antes do seu <script> de lógica -->



    <div class="show">
        <div width="300px">
            <h1 id="textoAlerta">valor</h1>
        </div>
        <div width="300px">
            <button id="showBotao">OK</button>
        </div>    
    </div>
    <script src="./banco/banco.js"></script>
    <script src="./banco/bancoObjetos.js"></script>
    <script src="main.js"></script>
